<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Game Developer Portfolio</title>
  <link rel="stylesheet" href="Desktop.css">
  <script src="Desktop.js" defer></script>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Achtergrondafbeelding/Fideo -->
   <div class="background"></div>
    <video id="BackgroundVideo" autoplay muted playsinline preload="auto">
      <source src="Fotos-Video/ZwedenFullGameplay.mp4" type="video/mp4">
    </video>
      

    <!-- Apps op de desktop -->
  <div id="desktopButtons-leftSide">
    <div id="DesktopLeft">
      <button class="Desktop-button" onclick="window.location.href='Discord/Aboutme.html'">
        <img src="Fotos-Video/Discord.jpg" alt="Discord">
      </button>
      <button class="Desktop-button" onclick="window.location.href='Unity/Unity.html'">
        <img src="Fotos-Video/Unity.jpg" alt="Projecten">
      </button>
      <button class="Desktop-button" onclick="window.location.href='Github/Github.html'">
        <img src="Fotos-Video/Github.jpg" alt="Contact">
      </button>
      <button class="Desktop-button" onclick="window.location.href='Maps-Zweden/Maps.html'">
        <img src="Fotos-Video/Maps.jpg" alt="Maps">
      </button>
  </div>
  <div id="desktop">
    <section id="hero" class="window active">
      <div class="container">
      </div>
    </section>
  </div>

  <!-- De enige echte taskbar -->
  <div id="taskbar">
    <!-- Apps in het midden -->
    <div id="taskbar-center">
      <button class="Windows-button" onclick="window.location.href='Desktop.html'">
        <img src="Fotos-Video/Windows.jpg" alt="Home">
      </button>
      <button class="Taskbar-button" onclick="window.location.href='Discord/Aboutme.html'">
        <img src="Fotos-Video/Discord.jpg" alt="Discord">
      </button>
      <button class="Taskbar-button" onclick="window.location.href='Unity/Unity.html'">
        <img src="Fotos-Video/Unity.jpg" alt="Projecten">
      </button>
      <button class="Taskbar-button" onclick="window.location.href='Github/Github.html'">
        <img src="Fotos-Video/Github.jpg" alt="Contact">
      </button>
       <button class="Taskbar-button" onclick="window.location.href='Maps-Zweden/Maps.html'">
        <img src="Fotos-Video/Maps.jpg" alt="Maps">
      </button>
      <!-- Video toggle-knop -->
      <button id="toggleVideo">Video uit</button>
      <!-- Reset-knop -->
      <button id="reset-Btn">Reset Alles</button>
    </div>

    <!-- Klok rechts -->
    <div id="Clock-right">
      <div id="clock"></div>
    </div>
  </div>
</body>
</html>
